# Headless `web-server` only (no Tauri). Used by build scripts that swap manifests or:
#   cargo build --manifest-path standalone-web-server/Cargo.toml --bin web-server --release
#
# The binary source lives at ../src/bin/web-server.rs

[package]
name = "rustinx-web-server"
version = "0.1.0"
description = "Rustinx Web Server - headless server component"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.76"

[[bin]]
name = "web-server"
path = "../src/bin/web-server.rs"

[dependencies]
rustinx-embed = { path = "../crates/rustinx-embed" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
log = "^0.4"
env_logger = "0.10"
sysinfo = "0.31.2"
actix-web = "4.9.0"
actix-session = { version = "0.8.0", features = ["cookie-session"] }
actix-cors = "0.6"
rand = "0.8"
futures-util = "0.3.31"
lazy_static = "1.4.0"

[target.'cfg(unix)'.dependencies]
nix = "0.28.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.29", features = ["Win32_Foundation", "Win32_Security", "Win32_System"] }
